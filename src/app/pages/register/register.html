<div class="register-component">
  <div class="auth-wrapper">

    <div class="auth-brand">
      <h2 class="auth-brand-name">Agenda Pro</h2>
      <p class="auth-brand-tagline">Crie sua conta e comece a se organizar</p>
    </div>

    <mat-card>
      <mat-card-header class="padding-m">
        <mat-card-title>Cadastro</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nome Completo</mat-label>
            <input matInput formControlName="nome" placeholder="">
            @if (fullNameError) {
            <mat-error>{{fullNameError}}</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="user123@example.com">
            @if (emailError) {
            <mat-error>{{emailError}}</mat-error>
            }
          </mat-form-field>

          <input-password-field [control]="passwordControl" [placeHolder]="'Cadastre sua senha'"></input-password-field>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button matButton="tonal" class="full-width" [disabled]="form.invalid || isLoading()" (click)="submit()">
          <span class="cad-button-content">
            {{isLoading() ? "Cadastrando..." : "Criar conta"}}
            @if (isLoading()) {<mat-spinner diameter="20"></mat-spinner>}
          </span>
        </button>
      </mat-card-actions>

      <div class="auth-footer-link">
        Já tem conta? <span class="auth-link-hint">Use o menu para entrar</span>
      </div>
    </mat-card>

  </div>
</div>
