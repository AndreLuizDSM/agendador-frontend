<section class="task-component">
    <mat-card appearance="outlined" class="task-card">
        <mat-card-content class="task-content">
            <h2>📋 Tarefas</h2>
            <p>Sem tarefas!</p>
            <p>Crie a sua tarefa!</p>
            <button matButton="filled" (click)="adicionarTarefa()"><span>🖊️ Criar a primeira tarefa</span></button>
        </mat-card-content>
    </mat-card>
</section>
