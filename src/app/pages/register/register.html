<div class="register-component">
    <mat-card>
        <mat-card-header class="padding-m">
            <mat-card-title>Cadastro de Usuário</mat-card-title>

        </mat-card-header>


        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nome Completo</mat-label>
                    <input matInput formControlName="fullName" placeholder="">
                    @if (fullNameError) {
                    <mat-error>{{fullNameError}}</mat-error>
                    }   
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" placeholder="user123@example.com">
                    
                    <!-- <mat-error *ngIf="form.get('email')?.errors?.['required']">Campo obrigatório*</mat-error> -->
                    @if (emailError) {
                    <mat-error>{{emailError}}</mat-error>
                    }
                </mat-form-field>

                <input-password-field [control]="passwordControl"></input-password-field>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <button matButton="tonal" class="full-width" [disabled]="form.invalid" (click)="submit()">Cadastrar</button>
        </mat-card-actions>

    </mat-card>
</div>
