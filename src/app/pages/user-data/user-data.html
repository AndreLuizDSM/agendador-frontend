<div class="user-data-component">
    <mat-card class="user-data-card" appearance="outlined">
        <mat-card-header class="user-data-header">
            <mat-card-title class="user-data-title"> Meus dados</mat-card-title>
            <mat-card-content>
                <form [formGroup]="form">
                    <mat-form-field class="full-width">
                        <mat-label>Nome</mat-label>
                        <input matInput formControlName="nome">
                    </mat-form-field>

                    <mat-form-field class="full-width">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email">
                    </mat-form-field>
                </form>

                <h3><strong>Endereços</strong></h3>
                <button matButton="filled" (click)="cadastrarEndereco()">Adicionar endereço</button>

                <h3><strong>Telefones</strong></h3>
                
                <mat-list>
                    
                    @for (telefone of user()?.telefones ?? []; track telefone.numero) {
                    <mat-list-item>{{telefone.ddd}} {{telefone.numero}}</mat-list-item>
                    }

                </mat-list>
                
                <button matButton="filled" (click)="cadastrarTelefone()">Adicionar telefone</button>
            </mat-card-content>
        </mat-card-header>

    </mat-card>
</div>
