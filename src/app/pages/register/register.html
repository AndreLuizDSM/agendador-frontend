<div class="register-component">
    <mat-card>
        <mat-card-header class="padding-m">
            <mat-card-title>Cadastro de Usuário</mat-card-title>

        </mat-card-header>

        <form [formGroup]="form">
            <mat-card-content>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nome Completo</mat-label>
                    <input matInput formControlName="fullName" placeholder="">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" placeholder="user123@example.com">
                </mat-form-field>

                <input-password-field [control]="passwordControl"></input-password-field>
            </mat-card-content>
        </form>

        <mat-card-actions>
            <button matButton="tonal" class="full-width" (click)="submit()">Cadastrar</button>
        </mat-card-actions>
   
    </mat-card>
</div>
